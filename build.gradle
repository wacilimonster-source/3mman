// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://maven.aliyun.com/repository/jcenter" }
        maven {
            url "https://maven.aliyun.com/nexus/content/repositories/releases"
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'org.greenrobot:greendao-gradle-plugin:3.3.0' // 升级到 3.3.0 以兼容 Gradle 7
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url "https://maven.aliyun.com/repository/jcenter" }
        maven { url "https://jitpack.io" }
        maven {
            url 'https://maven.aliyun.com/nexus/content/repositories/releases/'
        }
    }
    // Kotlin 1.5+ 已把 jdk7/jdk8 平台支持并入 kotlin-stdlib；把旧库仍声明的
    // kotlin-stdlib-jdk7/jdk8 重定向到 kotlin-stdlib，避免 androidx 依赖引发
    // “Duplicate class kotlin.collections.jdk8.CollectionsJDK8Kt” 冲突
    configurations.all {
        resolutionStrategy {
            dependencySubstitution {
                substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk8') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
                substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Define versions in a single place
ext {
    // Sdk and tools
    minSdkVersion = 28
    targetSdkVersion = 34
    compileSdkVersion = 34
    buildToolsVersion = '34.0.0'

    // App dependencies（AndroidX 迁移：support 库 → androidx，版本对应 compileSdk 34）
    androidxAppcompatVersion = '1.6.1'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.1'
    androidxRecyclerviewVersion = '1.3.1'
    androidxCardviewVersion = '1.0.0'
    materialVersion = '1.9.0'
    androidxCoordinatorlayoutVersion = '1.2.0'
    androidxViewpagerVersion = '1.0.0'
    androidxInterpolatorVersion = '1.0.0'
    androidxSwiperefreshlayoutVersion = '1.1.0'
    androidxLocalbroadcastmanagerVersion = '1.1.0'
    androidxVectorDrawableVersion = '1.1.0'
    androidxCollectionVersion = '1.1.0'
    androidxLifecycleVersion = '2.6.1'
    androidxMultidexVersion = '2.0.1'
    androidxConstraintlayoutVersion = '2.1.4'
    androidxTestJunitVersion = '1.1.5'
    androidxTestRunnerVersion = '1.5.2'

    // App dependencies
    exoPlayerVersion = "2.6.0"
    butterKnifeVersion = '9.0.0'
    daggerVersion = '2.21'
    retrofitVersion='2.5.0'
    markwonVersion = '2.0.1'
}