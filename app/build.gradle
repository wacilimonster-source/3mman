apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao' // apply plugin
//apply plugin: 'com.bugsnag.android.gradle' // apply on last line
android {
    compileSdkVersion parent.ext.compileSdkVersion
    buildToolsVersion parent.ext.buildToolsVersion
    defaultConfig {
        applicationId "com.m3man"
        minSdkVersion parent.ext.minSdkVersion
        targetSdkVersion parent.ext.targetSdkVersion
        versionCode 79
        versionName "1.0.46"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        ndk {
            // 设置支持的SO库架构：仅保留真机 32 位 armeabi-v7a，
            // 砍掉模拟器 x86 与古董 armeabi，显著缩减安装包体积
            abiFilters 'armeabi-v7a'//, 'x86', 'armeabi'//, 'x86_64', 'arm64-v8a'
        }
    }
    signingConfigs {
        release {
            storeFile file('../3mman.jks')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // zipalign优化
            zipAlignEnabled true
            // 移除无用的资源文件
            shrinkResources true
            // 混淆
            minifyEnabled true
            // 加载默认混淆配置文件 progudard-android.txt在sdk目录里面，不用管，proguard-rules.pro是我们自己配的混淆文件
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro', 'proguard-fresco.pro'
        }
        debug {
            ext.enableBugsnag = false
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro', 'proguard-fresco.pro'
        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // 打包名称
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "3mman_v${defaultConfig.versionName}.apk"
        }
    }
}

// JDK 17 + butterknife 9.0.0 兼容：注解处理器运行在 fork 的 javac 进程中，
// 通过 JVM 层 --add-opens 开放 jdk.compiler 内部包（不能使用 --add-exports，其与 target 8 冲突）
tasks.withType(JavaCompile) {
    options.fork = true
    options.forkOptions.jvmArgs += [
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
    ]
}

greendao {
    schemaVersion 9//数据库版本号（v9: V9MmanItem.isLocalFavorite 改为可空 + 迁移事务化，避免升级清空本地收藏/下载/历史）
}

/*
bugsnag {
    autoUpload false //自动上传ProGuard mapping file
    ndk false //上传ndk mapping
    autoReportBuilds false //report builds to Bugsnag
    retryCount 5 //Retrying the file upload
}
*/
