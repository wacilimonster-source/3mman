apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao' // apply plugin
//apply plugin: 'com.bugsnag.android.gradle' // apply on last line
android {
    compileSdkVersion parent.ext.compileSdkVersion
    buildToolsVersion parent.ext.buildToolsVersion
    defaultConfig {
        applicationId "com.m3man"
        minSdkVersion parent.ext.minSdkVersion
        targetSdkVersion parent.ext.targetSdkVersion
        versionCode 149
        versionName "1.0.116"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        ndk {
            // 设置支持的SO库架构：仅保留 64 位 arm64-v8a（R8 混淆 + 64 位，兼顾体积与新机型兼容）
            abiFilters 'arm64-v8a'
        }
    }
    // M101：JVM 单测中 android.util.Log 等桩返回默认值——Logger/Toast 类工具在纯 JVM 测试不崩
    testOptions {
        unitTests.returnDefaultValues = true
    }
    signingConfigs {
        release {
            storeFile file('C:/gwork/origks/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // zipalign优化
            zipAlignEnabled true
            // 移除无用的资源文件
            shrinkResources true
            // 混淆（AGP 7.4 下即 R8）
            minifyEnabled true
            // 加载默认混淆配置文件 progudard-android.txt在sdk目录里面，不用管，proguard-rules.pro是我们自己配的混淆文件
            // proguard-fresco.pro 为 Fresco 时代遗留（项目从未引入 Fresco，现用 Glide），已删除引用
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            ext.enableBugsnag = false
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // 打包名称
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "3mman_v${defaultConfig.versionName}.apk"
        }
    }
}

// JDK 17 + butterknife 9.0.0 兼容：注解处理器运行在 fork 的 javac 进程中，
// 通过 JVM 层 --add-opens 开放 jdk.compiler 内部包（不能使用 --add-exports，其与 target 8 冲突）
tasks.withType(JavaCompile) {
    options.fork = true
    options.forkOptions.jvmArgs += [
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
    ]
}

greendao {
    //v10: AutoCompleteEntity 唯一索引从 name 单列改为 (name,type) 复合（M62）
    //v11: AuthorFavorite 新增作者摘要缓存字段（videoCount/topViewKey/lastRefreshTime/lastNewTime/hasNew/coverUrl）
    //v12: AuthorFavorite 新增 lastViewKey——关联任一作品，UID token 过期时供作者页自愈重取
    //v13: V9MmanItem 新增 localFilePath——Scoped Storage 下载归档进 MediaStore 后的成品路径（Android 10+）
    //（v13 int→long 改造已回退：greenDAO 插件对实体 @Generated 同步存在兼容问题，见 M99 评审遗留）
    schemaVersion 13
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // AndroidX（迁移自 com.android.support:*）
    implementation "androidx.appcompat:appcompat:$androidxAppcompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.fragment:fragment:$androidxFragmentVersion"
    implementation "androidx.recyclerview:recyclerview:$androidxRecyclerviewVersion"
    implementation "androidx.cardview:cardview:$androidxCardviewVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorlayoutVersion"
    implementation "androidx.viewpager:viewpager:$androidxViewpagerVersion"
    implementation "androidx.interpolator:interpolator:$androidxInterpolatorVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$androidxSwiperefreshlayoutVersion"
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:$androidxLocalbroadcastmanagerVersion"
    implementation "androidx.vectordrawable:vectordrawable:$androidxVectorDrawableVersion"
    implementation "androidx.collection:collection:$androidxCollectionVersion"
    implementation "androidx.lifecycle:lifecycle-runtime:$androidxLifecycleVersion"
    implementation "androidx.multidex:multidex:$androidxMultidexVersion"
    implementation "androidx.constraintlayout:constraintlayout:$androidxConstraintlayoutVersion"
    implementation "com.google.android.material:material:$materialVersion"
    testImplementation 'junit:junit:4.12'
    androidTestImplementation "androidx.test:runner:$androidxTestRunnerVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxTestJunitVersion"
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
    implementation "com.squareup.retrofit2:converter-scalars:$retrofitVersion"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofitVersion"
    // jsoup HTML parser library @ https://jsoup.org/
    implementation 'org.jsoup:jsoup:1.11.3'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.46'
    // code generator for view
    implementation "com.jakewharton:butterknife:$butterKnifeVersion"
    annotationProcessor "com.jakewharton:butterknife-compiler:$butterKnifeVersion"
    implementation 'io.reactivex.rxjava2:rxjava:2.2.3'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    implementation 'com.github.franmontiel:PersistentCookieJar:v1.0.1'
    implementation 'com.orhanobut:logger:2.2.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.12.1'
    implementation 'cn.jzvd:jiaozivideoplayer:6.2.12'
    // Plain MVP'
    implementation 'com.hannesdorfmann.mosby3:viewstate:3.1.0'
    implementation 'com.trello.rxlifecycle2:rxlifecycle:2.2.2'
    // If you want to use Android Lifecycle for providers
    implementation 'com.trello.rxlifecycle2:rxlifecycle-android-lifecycle:2.2.2'
    implementation 'com.danikula:videocache:2.7.1'
    //rxcache
    implementation 'com.github.VictorAlbertos.RxCache:runtime:1.8.3-2.x'
    // To use Gson
    implementation 'com.github.VictorAlbertos.Jolyglot:gson:0.0.4'
    //compile 'com.yanzhenjie:recyclerview-swipe:1.1.3'
    implementation 'com.github.AItsuki:SwipeMenuRecyclerView:1.1.1'
    implementation 'com.liulishuo.filedownloader:library:1.7.4'
    implementation 'com.ycjiang:loadviewhelper:1.1.2'
    implementation 'com.yanzhenjie:permission:1.1.2'
    implementation ('com.sdsmdg.tastytoast:tastytoast:0.1.1'){
        exclude group: 'com.android.support'
    }
    //https://app.bugsnag.com/accounts/cbs-1/projects/android/integrate bug收集
    //implementation 'com.bugsnag:bugsnag-android:4.5.0'
    implementation 'com.github.rubensousa:floatingtoolbar:1.5.1'
    implementation 'com.qmuiteam:qmui:1.2.0'
    implementation 'com.github.arcadefire:nice-spinner:1.3.1'
    implementation 'org.greenrobot:greendao:3.2.2'
    // add library
    implementation 'de.greenrobot:java-common:2.3.1'
    implementation 'com.github.yuweiguocn:GreenDaoUpgradeHelper:v2.0.1'
    implementation 'cn.bingoogolapple:bga-swipebacklayout:1.2.0@aar'
    implementation 'com.jaeger.statusbarutil:library:1.5.1'
    debugImplementation 'com.amitshekhar.android:debug-db:1.0.4'
    implementation('com.github.bumptech.glide:glide:4.9.0') {
        exclude group: "com.android.support"
    }
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    implementation 'com.ashokvarma.android:bottom-navigation-bar:2.0.4'
    implementation 'me.jessyan:retrofit-url-manager:1.2.0'
    implementation 'org.greenrobot:eventbus:3.1.1'
    implementation 'com.oushangfeng:PinnedSectionItemDecoration:1.3.2'
    implementation 'cn.pedant.safewebviewbridge:library:1.4'
    // Dagger2 dependencies
    annotationProcessor "com.google.dagger:dagger-compiler:$rootProject.daggerVersion"
    implementation "com.google.dagger:dagger:$rootProject.daggerVersion"
    implementation "com.google.dagger:dagger-android:$rootProject.daggerVersion"
    implementation "com.google.dagger:dagger-android-support:$rootProject.daggerVersion"
    annotationProcessor "com.google.dagger:dagger-android-processor:$rootProject.daggerVersion"
    implementation 'com.github.chrisbanes:PhotoView:2.1.4'
    implementation('cn.qqtheme.framework:FilePicker:1.5.5') {
        exclude group: 'com.android.support'
    }
    implementation project(':exolibrary')
    implementation "ru.noties:markwon:$rootProject.markwonVersion"
    // 离线 OCR，用于登录验证码自动识别（无需 GMS/ML Kit）
    implementation 'com.rmtheis:tess-two:9.1.0'
}
